<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>1대1 축구 게임</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101b2d;color:#f5f7fb;font-family:Arial,"Noto Sans KR",sans-serif}
header{padding:17px max(18px,calc((100% - 1000px)/2));display:flex;justify-content:space-between;align-items:center;background:#14213d}
header strong{font-size:20px}nav a{color:#fff;text-decoration:none;padding:9px 14px;border-radius:9px}nav a.active,nav a:hover{background:#2d416b}
main{max-width:1000px;margin:28px auto;padding:0 16px}.top{text-align:center;margin-bottom:18px}.top h1{margin:0 0 8px;font-size:clamp(25px,5vw,36px)}.top p{color:#b9c6d9;margin:0}
.scoreboard{display:flex;justify-content:center;align-items:center;gap:18px;margin:8px 0 18px;font-weight:800;font-size:22px}.team-label{display:flex;flex-direction:row;align-items:center;gap:9px}.quarter-dots{display:inline-flex;align-items:center;gap:6px;min-width:60px;min-height:22px;vertical-align:middle}.quarter-dot{display:block;flex:0 0 16px;width:16px;height:16px;border:2px solid #fff;border-radius:50%;background:transparent}.red-dots .quarter-dot{border-color:#ff6464}.blue-dots .quarter-dot{border-color:#65a7ff}.red-dots .quarter-dot.filled{background:#ff6464}.blue-dots .quarter-dot.filled{background:#65a7ff}.match-info{display:flex;justify-content:center;gap:14px;margin:18px 0 8px;font-size:19px;font-weight:800;color:#ffd166}.match-info span{background:#1c2c43;padding:8px 16px;border-radius:10px}.red{color:#ff6464}.blue{color:#65a7ff}.score{font-size:34px;color:white}
.field-wrap{background:#1c2c43;padding:12px;border-radius:18px;box-shadow:0 12px 35px #0005}
canvas{display:block;width:100%;height:auto;min-height:260px;border-radius:10px;background:#27884c;touch-action:none}
.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:18px 0}.controls button{border:0;border-radius:11px;padding:12px 20px;font-weight:800;font-size:15px;cursor:pointer}.restart{background:#ffd166;color:#172033}.help{background:#334761;color:white}
.instructions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}.card{background:#1c2c43;padding:16px;border-radius:13px;line-height:1.7}.card h3{margin:0 0 5px}.note{text-align:center;color:#aebbd0;font-size:13px;margin:16px 0 30px}
@media(max-width:550px){.instructions{grid-template-columns:1fr}.scoreboard{gap:13px}.score{font-size:28px}.match-info{font-size:17px}.controls button{padding:11px 14px}}
</style>
</head>
<body>
<header><strong>⚽ MY WEBSITE</strong><nav><a href="index.html">홈</a><a class="active" href="game.html">게임</a></nav></header>
<main>
<div class="top"><h1>1대1 미니 축구</h1><p>친구와 함께 상대 팀 골대에 공을 넣어 봐!</p></div>
<div class="match-info"><span id="quarter">1쿼터</span><span id="timer">03:00</span></div>
<div class="scoreboard"><div class="team-label red"><span class="quarter-dots red-dots" id="redDots"><span class="quarter-dot"></span><span class="quarter-dot"></span><span class="quarter-dot"></span></span><span>빨강팀</span></div><span class="score" id="redScore">0</span><span>:</span><span class="score" id="blueScore">0</span><div class="team-label blue"><span>파랑팀</span><span class="quarter-dots blue-dots" id="blueDots"><span class="quarter-dot"></span><span class="quarter-dot"></span><span class="quarter-dot"></span></span></div></div>
<div class="field-wrap"><canvas id="field" width="900" height="520" aria-label="축구 경기장"></canvas></div>
<div class="controls"><button class="restart" id="restart">↻ 다시 시작</button><button class="help" id="pause">Ⅱ 일시정지</button></div>
<div class="instructions">
<div class="card"><h3 class="red">🔴 빨강팀</h3>이동: <b>W A S D</b><br>슛: <b>Space</b></div>
<div class="card"><h3 class="blue">🔵 파랑팀</h3>이동: <b>방향키 ↑ ↓ ← →</b><br>슛: <b>Enter</b></div>
</div>
<p class="note">각 쿼터는 3분이고 무승부면 1분 연장해. 쿼터별 승리 동그라미가 더 많은 팀이 최종 승리해! 선수 가까이에서 슛 키를 누르면 공을 찰 수 있어.</p>
</main>
<script>
(()=>{
const canvas=document.getElementById('field'),ctx=canvas.getContext('2d');
const W=900,H=520,goalH=156,keys={};
let redScore=0,blueScore=0,quarter=1,timeLeft=180,paused=false,finished=false,last=0,lastTouch=null;let redWins=0,blueWins=0,quarterRedGoals=0,quarterBlueGoals=0,extraTimeUsed=false;
const red={x:235,y:H/2,r:23,color:'#f04444',vx:0,vy:0};
const blue={x:665,y:H/2,r:23,color:'#3988ff',vx:0,vy:0};
const ball={x:W/2,y:H/2,r:12,vx:0,vy:0};
function resetPositions(){Object.assign(red,{x:235,y:H/2,vx:0,vy:0});Object.assign(blue,{x:665,y:H/2,vx:0,vy:0});Object.assign(ball,{x:W/2,y:H/2,vx:0,vy:0});lastTouch=null;}
function restart(){redScore=0;blueScore=0;redWins=0;blueWins=0;quarter=1;timeLeft=180;quarterRedGoals=0;quarterBlueGoals=0;extraTimeUsed=false;finished=false;paused=false;document.getElementById('pause').textContent='Ⅱ 일시정지';updateScore();updateClock();updateDots();resetPositions();}
function updateClock(){document.getElementById('quarter').textContent=quarter+'쿼터'+(extraTimeUsed?' 연장전':'');const m=Math.floor(timeLeft/60),s=Math.floor(timeLeft%60);document.getElementById('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}
function updateScore(){document.getElementById('redScore').textContent=redScore;document.getElementById('blueScore').textContent=blueScore;}
function updateDots(){[...document.querySelectorAll("#redDots .quarter-dot")].forEach((d,i)=>d.classList.toggle("filled",i<redWins));[...document.querySelectorAll("#blueDots .quarter-dot")].forEach((d,i)=>d.classList.toggle("filled",i<blueWins));}
function finishQuarter(){if(quarterRedGoals>quarterBlueGoals)redWins++;else if(quarterBlueGoals>quarterRedGoals)blueWins++;updateDots();if(quarter>=3){finished=true;return;}quarter++;timeLeft=180;quarterRedGoals=0;quarterBlueGoals=0;extraTimeUsed=false;resetPositions();updateClock();}
function draw(){
ctx.clearRect(0,0,W,H);ctx.fillStyle='#27884c';ctx.fillRect(0,0,W,H);
ctx.strokeStyle='rgba(255,255,255,.78)';ctx.lineWidth=4;ctx.strokeRect(18,18,W-36,H-36);
ctx.beginPath();ctx.moveTo(W/2,18);ctx.lineTo(W/2,H-18);ctx.stroke();
ctx.beginPath();ctx.arc(W/2,H/2,75,0,Math.PI*2);ctx.stroke();
ctx.strokeRect(18,H/2-goalH/2,105,goalH);ctx.strokeRect(W-123,H/2-goalH/2,105,goalH);
ctx.fillStyle='#e8edf3';ctx.fillRect(0,H/2-goalH/2,18,goalH);ctx.fillRect(W-18,H/2-goalH/2,18,goalH);
ctx.fillStyle='rgba(255,255,255,.14)';ctx.fillRect(18,H/2-goalH/2,28,goalH);ctx.fillRect(W-46,H/2-goalH/2,28,goalH);
drawPlayer(red,'R');drawPlayer(blue,'B');
drawSoccerBall();
if(paused||finished){ctx.fillStyle='#071323aa';ctx.fillRect(0,0,W,H);ctx.fillStyle='white';ctx.textAlign='center';ctx.font='bold 42px Arial';ctx.fillText(finished?(redWins>blueWins?'🔴 빨강팀 승리!':blueWins>redWins?'🔵 파랑팀 승리!':'🤝 무승부!'):'일시정지',W/2,H/2);ctx.font='20px Arial';ctx.fillText(finished?'3쿼터 종료! 다시 시작을 눌러 재경기!':'일시정지를 해제하고 계속해!',W/2,H/2+42);}
}
function drawSoccerBall(){
ctx.save();ctx.translate(ball.x,ball.y);
ctx.beginPath();ctx.arc(0,0,ball.r,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.clip();
ctx.fillStyle='#202a36';
function pentagon(cx,cy,r,rotation=0){ctx.beginPath();for(let i=0;i<5;i++){let a=rotation+i*Math.PI*2/5-Math.PI/2,x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.closePath();ctx.fill();}
pentagon(0,0,4.8,0);
for(let i=0;i<5;i++){let a=i*Math.PI*2/5-Math.PI/2;pentagon(Math.cos(a)*8.2,Math.sin(a)*8.2,3.3,a);}
ctx.restore();ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.lineWidth=1.5;ctx.strokeStyle='#202a36';ctx.stroke();
}
function drawPlayer(p,label){ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=p.color;ctx.fill();ctx.lineWidth=4;ctx.strokeStyle='white';ctx.stroke();ctx.fillStyle='white';ctx.font='bold 17px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(label,p.x,p.y+1);}
function movePlayer(p,up,down,left,right,dt){
let dx=(keys[right]?1:0)-(keys[left]?1:0),dy=(keys[down]?1:0)-(keys[up]?1:0),len=Math.hypot(dx,dy)||1;
const speed=235;p.x+=dx/len*speed*dt;p.y+=dy/len*speed*dt;
p.x=Math.max(42,Math.min(W-42,p.x));p.y=Math.max(42,Math.min(H-42,p.y));
}
function kick(p){let dx=ball.x-p.x,dy=ball.y-p.y,d=Math.hypot(dx,dy);if(d<65){let l=d||1;ball.vx=dx/l*480;ball.vy=dy/l*480;lastTouch=p===red?'red':'blue';}}
function collide(p){let dx=ball.x-p.x,dy=ball.y-p.y,d=Math.hypot(dx,dy),min=p.r+ball.r;if(d<min){let l=d||1,nx=dx/l,ny=dy/l;ball.x=p.x+nx*min;ball.y=p.y+ny*min;ball.vx+=nx*90+p.vx*.22;ball.vy+=ny*90+p.vy*.22;lastTouch=p===red?'red':'blue';}}
function goal(team){if(team==='red'){redScore++;quarterRedGoals++;}else{blueScore++;quarterBlueGoals++;}updateScore();resetPositions();}
function restartFromLine(x,y){
const next=lastTouch==='red'?'blue':'red';
// 아웃되면 공을 상대 팀이 아니라, 공을 받는 팀의 자기 골대 앞에 둔다.
ball.x=next==='blue'?W-145:145;
ball.y=H/2;
ball.vx=0;ball.vy=0;
red.vx=red.vy=blue.vx=blue.vy=0;
if(next==='blue'){
  // 파랑팀이 지키는 오른쪽 골대 바로 앞에서 공을 두고 시작
  blue.x=W-80;blue.y=H/2;
  ball.x=W-125;ball.y=H/2;
  red.x=235;red.y=H/2;
}else{
  // 빨강팀이 지키는 왼쪽 골대 바로 앞에서 공을 두고 시작
  red.x=80;red.y=H/2;
  ball.x=125;ball.y=H/2;
  blue.x=665;blue.y=H/2;
}
lastTouch=null;
}
function update(dt){
timeLeft-=dt;if(timeLeft<=0){timeLeft=0;updateClock();if(quarterRedGoals===quarterBlueGoals&&!extraTimeUsed){extraTimeUsed=true;timeLeft=60;updateClock();return;}finishQuarter();return;}updateClock();
movePlayer(red,'w','s','a','d',dt);movePlayer(blue,'ArrowUp','ArrowDown','ArrowLeft','ArrowRight',dt);
collide(red);collide(blue);
ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;const drag=Math.pow(.985,dt*60);ball.vx*=drag;ball.vy*=drag;
if(Math.abs(ball.vx)<3)ball.vx=0;if(Math.abs(ball.vy)<3)ball.vy=0;
const inGoal=ball.y>H/2-goalH/2+5&&ball.y<H/2+goalH/2-5;
if(ball.x<18&&inGoal){goal('blue');return;}
if(ball.x>W-18&&inGoal){goal('red');return;}
if(ball.y<18){restartFromLine(ball.x,18);return;}
if(ball.y>H-18){restartFromLine(ball.x,H-18);return;}
if(ball.x<18){restartFromLine(18,ball.y);return;}
if(ball.x>W-18){restartFromLine(W-18,ball.y);return;}
}
function loop(t){let dt=Math.min((t-last)/1000||0,.03);last=t;if(!paused&&!finished)update(dt);draw();requestAnimationFrame(loop);}
window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Enter'].includes(e.key))e.preventDefault();keys[e.key.length===1?e.key.toLowerCase():e.key]=true;if(e.repeat)return;if(e.code==='Space')kick(red);if(e.key==='Enter')kick(blue);});
window.addEventListener('keyup',e=>{keys[e.key.length===1?e.key.toLowerCase():e.key]=false;});
document.getElementById('restart').addEventListener('click',restart);
document.getElementById('pause').addEventListener('click',()=>{if(finished)return;paused=!paused;document.getElementById('pause').textContent=paused?'▶ 계속하기':'Ⅱ 일시정지';});
updateScore();updateClock();updateDots();draw();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
